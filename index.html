<style>
  /* ====== CONFIGURACIÓN ======
     Para editar la carta desde Google Sheets: compartir la planilla como "Cualquier persona
     con el enlace · Lector" y pegar su enlace en SHEET_URL (más abajo, en el <script>). Si queda vacío se usa la carta de respaldo incluida en este archivo. */

  :root{
    --bg:#F3EEE6; --text:#2A1F17; --muted:#6E5F52; --line:#E0D6C8; --surface:#FBF8F3;
    --hero:#7A3E26; --hero-text:#FBF3EA; --hero-chip:rgba(255,255,255,.16);
    --t1:#B5653F; --t2:#6F7550; --t3:#8C6A4A; --t4:#4E3B2E; --tile-text:#FFF8F0;
    --btn:#2A1F17; --btn-text:#F3EEE6; --price:#2A1F17;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161210; --text:#F2E8DC; --muted:#ABA092; --line:#2E2620; --surface:#1E1915;
      --hero:#3A2219; --hero-text:#F6E6D6; --hero-chip:rgba(255,255,255,.1);
      --t1:#7A3E26; --t2:#4B5036; --t3:#5C4532; --t4:#3A2C22; --tile-text:#F6EADB;
      --btn:#E3A47C; --btn-text:#161210; --price:#F2E8DC;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:70px}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased}
  .wrap{max-width:560px; margin:0 auto; padding:0 20px 120px}
  .serif{font-family:'Fraunces',Georgia,serif}

  header{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:28px 0 18px}
  .kicker{font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:var(--muted)}
  h1{margin:2px 0 4px; font-size:32px; font-weight:600; line-height:1.05}
  .addr{display:flex; align-items:center; gap:5px; font-size:13px; color:var(--muted)}
  header img{width:76px; height:76px; flex:none}

  .chef{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -20px; padding:4px 20px 2px; scrollbar-width:none}
  .chef::-webkit-scrollbar{display:none}
  .hero{flex:0 0 88%; scroll-snap-align:center; background:var(--hero); color:var(--hero-text); border-radius:26px; padding:22px; display:flex; flex-direction:column; gap:10px}
  .chef .hero:only-child{flex-basis:100%}
  .badge{align-self:flex-start; padding:5px 10px; border-radius:999px; background:var(--hero-chip); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase}
  .hero h2{margin:0; font-size:27px; font-weight:600; line-height:1.1}
  .hero p{margin:0; font-size:13.5px; line-height:1.5; opacity:.88}
  .hero .p{font-size:20px; font-weight:700; margin-top:auto}
  .dots{display:flex; justify-content:center; gap:6px; padding-top:10px}
  .dots span{width:6px; height:6px; border-radius:6px; background:var(--line); transition:.2s}
  .dots span.on{width:18px; background:var(--muted)}

  .bento{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding-top:14px}
  .tile{border-radius:22px; padding:16px; min-height:96px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; color:var(--tile-text); text-decoration:none; transition:transform .15s}
  .tile:active{transform:scale(.97)}
  .tile.wide{grid-column:span 2; min-height:80px}
  .tile .top{display:flex; justify-content:space-between; align-items:center; font-size:12px; font-weight:600; opacity:.9}
  .tile .name{font-size:18px; font-weight:600; line-height:1.15}

  nav.chips{position:sticky; top:0; z-index:5; display:flex; gap:8px; overflow-x:auto; margin:26px -20px 0; padding:12px 20px; background:var(--bg); border-bottom:1px solid var(--line); scrollbar-width:none}
  nav.chips::-webkit-scrollbar{display:none}
  nav.chips a{flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); color:var(--text); font-size:13px; font-weight:500; text-decoration:none; white-space:nowrap}
  nav.chips a.on{background:var(--text); color:var(--bg); border-color:var(--text)}

  section.cat{padding-top:28px}
  section.cat h2{margin:0 0 6px; font-size:24px; font-weight:600}
  .row{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:14px 0; border-top:1px solid var(--line)}
  .row .n{font-size:15.5px; font-weight:500; line-height:1.3}
  .row .d{margin-top:4px; font-size:13px; line-height:1.45; color:var(--muted)}
  .row .p{flex:none; font-size:15px; font-weight:700; color:var(--price)}
  h3.sub{display:flex; align-items:center; gap:12px; margin:22px 0 4px; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted)}
  h3.sub::after{content:""; flex:1; height:1px; background:var(--line)}
  h3.sub + .row{border-top:0}
  .note{margin:2px 0 0; padding:12px 14px; border-radius:14px; background:var(--surface); font-size:13px; color:var(--muted)}
  .status{padding:40px 0; text-align:center; color:var(--muted); font-size:14px}

  footer{padding:40px 0 0; text-align:center; font-size:12.5px; color:var(--muted); line-height:1.6}

  .fab{position:fixed; right:max(16px, env(safe-area-inset-right)); bottom:max(20px, env(safe-area-inset-bottom)); z-index:10; display:flex; gap:10px}
  .fab a{height:56px; padding:0 20px; border-radius:18px; background:var(--btn); color:var(--btn-text); display:flex; align-items:center; gap:9px; text-decoration:none; font-size:15px; font-weight:700; box-shadow:0 10px 28px rgba(20,12,6,.3)}
  .fab a:active{transform:scale(.97)}
  @media (max-width:380px){ .fab a.ig{padding:0; width:56px; justify-content:center} .fab a.ig span{display:none} }
  @media (min-width:600px){ .fab{right:calc(50% - 280px + 20px)} }
</style>
</head>

const CHEF_CAT = "recomendación del chef";
const LEAF = '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c8 0 14-6 14-14C11 5 5 11 5 19z"/><path d="M5 19L13 11"/></svg>';

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c=='"') q=true;
    else if(c==','){ row.push(cell); cell=''; }
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||'').trim()])));
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yes=v=>/^(si|sí|x|1|true)$/i.test(v||'');
const no=v=>/^(no|0|false)$/i.test(v||'');
function price(v){
  const d=(v||'').replace(/\D/g,'');
  return d ? '$'+Number(d).toLocaleString('es-CL') : (v||'Consultar');
}
const slug=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

function render(items){
  rendered=true;
  items=items.filter(i=>!no(i.disponible));
  const cats=[];
  const byCat={};
  for(const it of items){
    const c=it.categoria||'Otros';
    if(!byCat[c]){ byCat[c]=[]; cats.push(c); }
    byCat[c].push(it);
  }
  // Recomendación del chef: destacados
  const chef=items.filter(i=>i.nombre && (yes(i.destacado) || (i.categoria||'').toLowerCase()==CHEF_CAT));
  const chefEl=document.getElementById('chef');
  chefEl.innerHTML=chef.map(i=>`<article class="hero">
      <span class="badge">Recomendación del chef</span>
      <h2 class="serif">${esc(i.nombre)}</h2>
      ${i.descripcion?`<p>${esc(i.descripcion)}</p>`:''}
      <span class="p">${price(i.precio)}</span></article>`).join('');
  const dots=document.getElementById('dots');
  if(chef.length>1){
    dots.innerHTML=chef.map((_,k)=>`<span class="${k?'':'on'}"></span>`).join('');
    chefEl.addEventListener('scroll',()=>{
      const k=Math.round(chefEl.scrollLeft/(chefEl.firstElementChild.offsetWidth+12));
      [...dots.children].forEach((d,j)=>d.classList.toggle('on',j==k));
    },{passive:true});
  } else dots.innerHTML='';

  const menuCats=cats.filter(c=>c.toLowerCase()!=CHEF_CAT);
  const tones=['var(--t1)','var(--t2)','var(--t3)','var(--t4)'];
  document.getElementById('bento').innerHTML=menuCats.map((c,k)=>{
    const n=byCat[c].filter(i=>i.nombre).length;
    const wide=(k==menuCats.length-1 && menuCats.length%2==1)?' wide':'';
    return `<a class="tile${wide}" href="#${slug(c)}" style="background:${tones[k%4]}">
      <span class="top">${LEAF}<span>${n} ${n==1?'opción':'opciones'}</span></span>
      <span class="name serif">${esc(c)}</span></a>`;
  }).join('');

  document.getElementById('chips').innerHTML=menuCats.map(c=>`<a href="#${slug(c)}" data-cat="${slug(c)}">${esc(c)}</a>`).join('');

  document.getElementById('menu').innerHTML=menuCats.map(c=>`<section class="cat" id="${slug(c)}">
    <h2 class="serif">${esc(c)}</h2>
    ${byCat[c].map((i,k,arr)=> (i.subtitulo && i.subtitulo!==(arr[k-1]||{}).subtitulo ? `<h3 class="sub">${esc(i.subtitulo)}</h3>` : '') + (i.nombre ? `<div class="row"><div><div class="n">${esc(i.nombre)}</div>${i.descripcion?`<div class="d">${esc(i.descripcion)}</div>`:''}</div><span class="p">${price(i.precio)}</span></div>`
      : `<p class="note">${esc(i.descripcion)}</p>`)).join('')}
  </section>`).join('');

  // resaltar categoría visible
  const chips=document.getElementById('chips');
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      chips.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.cat==e.target.id));
      const on=chips.querySelector('a.on'); if(on) chips.scrollTo({left:on.offsetLeft-20,behavior:'smooth'});
    }});
  },{rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('section.cat').forEach(s=>obs.observe(s));
}

function sheetCsvUrl(){
  const m=SHEET_URL.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if(!m) return null;
  const gid=(SHEET_URL.match(/[#&?]gid=(\d+)/)||[])[1]||'0';
  // Endpoint de lectura directa: no usa la copia en caché de "Publicar en la web"
  return `https://docs.google.com/spreadsheets/d/${m[1]}/gviz/tq?tqx=out:csv&headers=1&gid=${gid}&t=${Date.now()}`;
}
async function fetchSheet(){
  const u=sheetCsvUrl(); if(!u) return null;
  try{
    const r=await fetch(u,{cache:'no-store'});
    if(!r.ok) return null;
    const items=parseCSV(await r.text());
    return items.length && 'categoria' in items[0] ? items : null;
  }catch(e){ return null; }
}
let rendered=false;
async function load(){
  const items=await fetchSheet();
  if(items){ render(items); return true; }
  if(!rendered) render(parseCSV(CARTA_RESPALDO));
  return false;
}
load();
// Al volver a la página (por ejemplo, después de cambiar de app) se vuelve a leer la planilla
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(); });
</script>
